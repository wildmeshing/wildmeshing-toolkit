[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pywmtk"
version = "0.1.0"
readme = "README.md"
dependencies = ["numpy>=2.0", "gmsh", "scipy", "h5py"]

# Also requires the `wildmeshing` bindings built from this repository:
# pip install <wildmeshing-toolkit root>.
[tool.setuptools]
packages = [
    "pywmtk",
    "pywmtk.polyfem_ops",
    "pywmtk.polyfem_ops.minimum_separation",
    "pywmtk.polyfem_ops.laplacian_smoothing",
    "pywmtk.polyfem_ops.polyfem_sim",
]

[tool.setuptools.package-data]
"pywmtk.polyfem_ops.minimum_separation" = ["spec.json"]
"pywmtk.polyfem_ops.laplacian_smoothing" = ["spec.json"]
