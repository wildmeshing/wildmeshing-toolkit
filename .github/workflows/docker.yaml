name: Build and Push Docker Images

# The image is built and pushed on main, and on a version tag (tagged with the version too), not
# on pull requests: building it takes about 25 minutes and a pull request's image is never used.
on:
  push:
    branches:
      - main
    tags:
      - "v*"

jobs:
  build-and-push-standard:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Free Disk Space (Ubuntu)
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          docker-images: false
          swap-storage: false

      - name: Log in to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Cache Docker layers
        uses: actions/cache@v5
        with:
          path: /tmp/.buildx-cache
          key: docker-${{ runner.os }}-${{ github.sha }}
          restore-keys: docker-${{ runner.os }}-

      - name: Build and Push Standard Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: true
          # latest follows main; a version tag is also pushed as wmtk:<tag>.
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/wmtk:latest
            ${{ secrets.DOCKER_USERNAME }}/wmtk:${{ github.sha }}
            ${{ github.ref_type == 'tag' && format('{0}/wmtk:{1}', secrets.DOCKER_USERNAME, github.ref_name) || '' }}
          cache-from: type=local,src=/tmp/.buildx-cache
          cache-to: type=local,dest=/tmp/.buildx-cache,mode=max
          platforms: linux/amd64

      - name: Test Standard Docker Image
        run: docker run --rm ${{ secrets.DOCKER_USERNAME }}/wmtk:latest --help
