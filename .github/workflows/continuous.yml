name: Build

on:
  push:
    branches: [main]
  pull_request:
  # Manual runs, with an option to open an SSH session on the runner. A failure that
  # reproduces only in CI -- a different CPU, a different libstdc++, a restored ccache -- cannot
  # be chased from a laptop, and a bare signal with no stack trace is not enough to reason from.
  # See the "Debug over SSH" step below.
  workflow_dispatch:
    inputs:
      debug_ssh:
        description: "Open a tmate SSH session on the runner when a step fails"
        type: boolean
        default: false
      debug_ssh_always:
        description: "Open the session even when everything passes (to poke at a green runner)"
        type: boolean
        default: false

# A new push to a pull request cancels the run of the previous one. Pushes to main and manual runs
# each get a group of their own (the run id), so they are never cancelled.
concurrency:
  group: build-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

# Compiler caches. Each job restores the newest cache of its runner and config, and saves it right
# after the build -- whether the build or the tests pass or not, so a failing pull request still
# leaves the next push its objects. ccache is trimmed first to the entries this build used: the
# repository's 10 GB of Actions cache holds every job's, and stale entries pushed main's out.
#
# Tests run in parallel, one per core (CTEST_PARALLEL_LEVEL per job). Long tests carry a COST
# (tests/CMakeLists.txt, components/cmake/add_component_test.cmake, docs/examples/CMakeLists.txt)
# so they start first.
env:
  CTEST_OUTPUT_ON_FAILURE: ON

jobs:
  ####################
  # Linux
  ####################

  Linux:
    name: ${{ matrix.name }} (${{ matrix.config }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            config: Debug
            integration_tests_flag: &integration_tests_off ""
            name: Linux
          - os: ubuntu-latest
            config: Release
            integration_tests_flag: &integration_tests_on "-DWMTK_BUILD_INTEGRATION_TESTS=ON"
            name: Linux
            # The documentation's Python and JSON examples run in the arm64 Release job only.
            # On x86-64 they were the longest test of the run, 11 minutes alone and 31 beside
            # the other tests (the runners' four vCPUs gain little from running tests side by
            # side); arm64 runs them in 19 beside the others. Every Release job still runs the
            # C++ examples.
            ctest_args: -E "^doc_examples_python_json$"
          # arm64 runners. Until these existed the matrix covered Linux only on x86-64 and
          # arm64 only on macOS, so no job compiled the combination -- which is exactly where
          # a `char` signedness bug in VolumeRemesher hid: `char` is signed on x86-64 and on
          # Apple's arm64 ABI, but unsigned under AAPCS64, so a stored orient3d of -1 read
          # back as 255 and every constraint was silently discarded.
          - os: ubuntu-24.04-arm
            config: Debug
            integration_tests_flag: *integration_tests_off
            name: Linux arm64
          - os: ubuntu-24.04-arm
            config: Release
            integration_tests_flag: *integration_tests_on
            name: Linux arm64
    env:
      # The runners have 4 cores.
      CTEST_PARALLEL_LEVEL: 4
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 10

      - name: Dependencies
        run: |
          sudo apt-get update
          # python3-numpy: the system interpreter builds the Python module, and with NumPy
          # ctest also runs its memory-interface and tracking tests (tests/python/test_memory_io.py,
          # tests/python/test_tracking.py); python3-pytest: and the pipeline's
          # (tests/python/test_pipeline.py).
          sudo apt-get -o Acquire::Retries=3 install ccache python3-numpy python3-pytest
          echo "CCACHE_DIR=$HOME/.cache/ccache" >> "$GITHUB_ENV"

      # runner.arch keeps the x86-64 and arm64 jobs apart: runner.os is "Linux" for both, so
      # without it the two jobs of one config shared a cache, each restoring the other's objects
      # (no use across architectures) and saving them again.
      - name: Restore ccache
        id: restore-cache
        uses: actions/cache/restore@v5
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-${{ runner.os }}-${{ runner.arch }}-${{ matrix.config }}-${{ github.sha }}
          restore-keys: ccache-${{ runner.os }}-${{ runner.arch }}-${{ matrix.config }}-

      - name: Prepare ccache
        run: |
          ccache -V && ccache --show-stats && ccache --zero-stats
          # What the build uses from here on survives the trim below.
          echo "CCACHE_SINCE=$(date +%s)" >> "$GITHUB_ENV"

      # ccache through CMakeLists.txt's launcher, which finds it on PATH and sets its base
      # directory and sloppiness. Debug builds with -g1 (functions and line tables, no
      # variables): enough for the backtrace step below, and a cache several times smaller.
      - name: Configure
        run: |
          mkdir -p build
          cd build
          cmake .. \
            -DCMAKE_BUILD_TYPE=${{ matrix.config }} \
            -DCMAKE_C_FLAGS_DEBUG=-g1 -DCMAKE_CXX_FLAGS_DEBUG=-g1 \
            -DWMTK_BUILD_DOC_EXAMPLES=${{ matrix.config == 'Release' && 'ON' || 'OFF' }} \
            ${{ matrix.integration_tests_flag }}

      - name: Build
        id: build
        run: cd build; make -j"$(nproc)"; ccache --show-stats

      - name: Trim ccache
        if: always() && (steps.build.outcome == 'success' || steps.build.outcome == 'failure')
        run: |
          ccache --evict-older-than "$(( $(date +%s) - CCACHE_SINCE + 60 ))s"
          ccache --show-stats

      - name: Save ccache
        if: >-
          always() && (steps.build.outcome == 'success' || steps.build.outcome == 'failure') &&
          steps.restore-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ steps.restore-cache.outputs.cache-primary-key }}

      - name: Tests
        run: cd build; ctest --verbose --output-on-failure ${{ matrix.ctest_args }}

      # A crash in CI otherwise reports a bare signal and nothing else: Catch2 prints
      # "SIGILL - Illegal instruction signal" and the name of the test that was running, with no
      # frame to work from. That cost a day of guessing at a failure that reproduced on no
      # developer machine. gdb re-runs the one binary that died and prints where.
      #
      # Best-effort by design: `|| true` everywhere, and `if: failure()` so it costs a green run
      # nothing. It re-runs the WHOLE binary rather than the single case, because a crash that
      # only appears after earlier tests have run is exactly the kind this exists to catch.
      - name: Backtrace a crashed test
        if: failure()
        run: |
          sudo apt-get -o Acquire::Retries=3 install -y gdb || true
          cd build
          # The tests that failed, as ctest recorded them ("<number>:<name>" per line).
          failed=$(sed 's/^[0-9]*://' Testing/Temporary/LastTestsFailed.log 2>/dev/null)
          for t in $failed; do
            bin=$(find . -type f -perm -u+x -name "$t" 2>/dev/null | head -1)
            [ -x "$bin" ] || continue
            echo "::group::gdb $t"
            gdb -batch -ex run -ex "thread apply all bt" --args "$bin" 2>&1 | tail -80 || true
            echo "::endgroup::"
          done

      # Interactive access to the runner, manual runs only. Never triggers on a push or a PR:
      # workflow_dispatch is the only event that defines these inputs, and they default to false.
      - name: Debug over SSH (tmate)
        if: >-
          always() && github.event_name == 'workflow_dispatch' &&
          (inputs.debug_ssh_always || (failure() && inputs.debug_ssh))
        uses: mxschmitt/action-tmate@v3
        with:
          # Only the user who started the run can connect.
          limit-access-to-actor: true
        timeout-minutes: 30

  # The Linux Release job built with WMTK_PER_INPUT_ORIENTATION (one orientation count per input on
  # every tracked face, SurfaceTagAttributes::m_input_orientation), running the suites that touch
  # the orientation: the option changes the face record, every operation that carries it, the
  # insertion and the tagged-mesh IO, and no other job builds it.
  LinuxPerInputOrientation:
    name: Linux per-input orientation (Release)
    runs-on: ubuntu-latest
    env:
      WMTK_ORIENTATION_TESTS: >-
        wmtk_tests wmtk_component_io_tests wmtk_test_tetwild wmtk_test_triwild wmtk_test_simwild
        wmtk_test_topological_offset
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 10

      - name: Dependencies
        run: |
          sudo apt-get update
          sudo apt-get -o Acquire::Retries=3 install ccache
          echo "CCACHE_DIR=$HOME/.cache/ccache" >> "$GITHUB_ENV"

      - name: Restore ccache
        id: restore-cache
        uses: actions/cache/restore@v5
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-${{ runner.os }}-${{ runner.arch }}-Release-orientation-${{ github.sha }}
          restore-keys: ccache-${{ runner.os }}-${{ runner.arch }}-Release-orientation-

      - name: Prepare ccache
        run: |
          ccache -V && ccache --show-stats && ccache --zero-stats
          echo "CCACHE_SINCE=$(date +%s)" >> "$GITHUB_ENV"

      - name: Configure
        run: |
          mkdir -p build
          cd build
          cmake .. \
            -DCMAKE_BUILD_TYPE=Release \
            -DWMTK_PER_INPUT_ORIENTATION=ON

      - name: Build
        id: build
        run: |
          cd build
          make -j"$(nproc)" $WMTK_ORIENTATION_TESTS
          ccache --show-stats

      - name: Trim ccache
        if: always() && (steps.build.outcome == 'success' || steps.build.outcome == 'failure')
        run: |
          ccache --evict-older-than "$(( $(date +%s) - CCACHE_SINCE + 60 ))s"
          ccache --show-stats

      - name: Save ccache
        if: >-
          always() && (steps.build.outcome == 'success' || steps.build.outcome == 'failure') &&
          steps.restore-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ steps.restore-cache.outputs.cache-primary-key }}

      # One binary per core, each into its own log, printed one group each once all are done;
      # every binary runs, and the step fails if any did.
      - name: Tests
        run: |
          cd build
          mkdir -p orientation-logs
          printf '%s\n' $WMTK_ORIENTATION_TESTS | xargs -P"$(nproc)" -I{} sh -c '
            bin=$(find . -type f -perm -u+x -name "{}" | head -1)
            "$bin" --allow-running-no-tests > "orientation-logs/{}.log" 2>&1
            echo $? > "orientation-logs/{}.rc"'
          failed=0
          for t in $WMTK_ORIENTATION_TESTS; do
            echo "::group::$t"
            cat "orientation-logs/$t.log"
            echo "::endgroup::"
            rc=$(cat "orientation-logs/$t.rc")
            if [ "$rc" != 0 ]; then echo "::error::$t failed (exit code $rc)"; failed=1; fi
          done
          exit $failed

  ####################
  # MacOS
  ####################

  MacOS:
    name: ${{ matrix.os }} (${{ matrix.config }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            config: Debug
            integration_tests_flag: *integration_tests_off
          - os: macos-latest
            config: Release
            integration_tests_flag: *integration_tests_on

    env:
      # macos-latest has 3 cores.
      CTEST_PARALLEL_LEVEL: 3
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 10

      - name: Dependencies
        run: |
          brew install ccache
          echo "CCACHE_DIR=$HOME/Library/Caches/ccache" >> "$GITHUB_ENV"

      - name: Restore ccache
        id: restore-cache
        uses: actions/cache/restore@v5
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-${{ runner.os }}-${{ runner.arch }}-${{ matrix.config }}-${{ github.sha }}
          restore-keys: ccache-${{ runner.os }}-${{ runner.arch }}-${{ matrix.config }}-

      - name: Prepare ccache
        run: |
          ccache -V && ccache --show-stats && ccache --zero-stats
          echo "CCACHE_SINCE=$(date +%s)" >> "$GITHUB_ENV"

      # As on Linux: ccache through CMakeLists.txt's launcher, Debug with -g1.
      - name: Configure
        run: |
          mkdir -p build
          cd build
          cmake .. \
            -DCMAKE_BUILD_TYPE=${{ matrix.config }} \
            -DCMAKE_C_FLAGS_DEBUG=-g1 -DCMAKE_CXX_FLAGS_DEBUG=-g1 \
            -DWMTK_BUILD_DOC_EXAMPLES=${{ matrix.config == 'Release' && 'ON' || 'OFF' }} \
            ${{ matrix.integration_tests_flag }}

      - name: Build
        id: build
        run: cd build; make -j"$(sysctl -n hw.ncpu)"; ccache --show-stats

      - name: Trim ccache
        if: always() && (steps.build.outcome == 'success' || steps.build.outcome == 'failure')
        run: |
          ccache --evict-older-than "$(( $(date +%s) - CCACHE_SINCE + 60 ))s"
          ccache --show-stats

      - name: Save ccache
        if: >-
          always() && (steps.build.outcome == 'success' || steps.build.outcome == 'failure') &&
          steps.restore-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ steps.restore-cache.outputs.cache-primary-key }}

      - name: Tests
        run: cd build; ctest --verbose --output-on-failure

      # A crash in CI otherwise reports a bare signal and nothing else: Catch2 prints
      # "SIGILL - Illegal instruction signal" and the name of the test that was running, with no
      # frame to work from. That cost a day of guessing at a failure that reproduced on no
      # developer machine. gdb re-runs the one binary that died and prints where.
      #
      # Best-effort by design: `|| true` everywhere, and `if: failure()` so it costs a green run
      # nothing. It re-runs the WHOLE binary rather than the single case, because a crash that
      # only appears after earlier tests have run is exactly the kind this exists to catch.
      - name: Backtrace a crashed test
        if: failure()
        run: |
          # lldb ships with the Xcode command line tools; nothing to install.
          cd build
          # The tests that failed, as ctest recorded them ("<number>:<name>" per line).
          failed=$(sed 's/^[0-9]*://' Testing/Temporary/LastTestsFailed.log 2>/dev/null)
          for t in $failed; do
            bin=$(find . -type f -perm -u+x -name "$t" 2>/dev/null | head -1)
            [ -x "$bin" ] || continue
            echo "::group::lldb $t"
            lldb -b -o run -o "thread backtrace all" -- "$bin" 2>&1 | tail -80 || true
            echo "::endgroup::"
          done

      # Interactive access to the runner, manual runs only. Never triggers on a push or a PR:
      # workflow_dispatch is the only event that defines these inputs, and they default to false.
      - name: Debug over SSH (tmate)
        if: >-
          always() && github.event_name == 'workflow_dispatch' &&
          (inputs.debug_ssh_always || (failure() && inputs.debug_ssh))
        uses: mxschmitt/action-tmate@v3
        with:
          # Only the user who started the run can connect.
          limit-access-to-actor: true
        timeout-minutes: 30

  ####################
  # Windows
  ####################

  Windows:
    name: ${{ matrix.name }} (${{ matrix.config }})
    runs-on: ${{ matrix.os }}
    env:
      SCCACHE_IDLE_TIMEOUT: "12000"
      # sccache cannot be trimmed to the entries a build used, as ccache is on Linux and macOS:
      # this caps what each Windows job keeps in the repository's 10 GB of Actions cache.
      SCCACHE_CACHE_SIZE: 1G
      # The runners have 4 cores.
      CTEST_PARALLEL_LEVEL: 4
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025-vs2026
            name: Windows 2025 (VS 2026)
            config: Debug
            vs_path: &vs_path_2026 'C:\Program Files\Microsoft Visual Studio\18\Enterprise\Common7\Tools\VsDevCmd.bat'
            integration_tests_flag: *integration_tests_off
          - os: windows-2025-vs2026
            name: Windows 2025 (VS 2026)
            config: Release
            vs_path: *vs_path_2026
            integration_tests_flag: *integration_tests_on

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 10

      # sccache from its GitHub releases, not Chocolatey: the community feed answered 503/499
      # and failed both Windows jobs before they built anything. Same version choco installed.
      - name: Dependencies
        uses: mozilla-actions/sccache-action@v0.0.11
        with:
          version: "v0.17.0"

      - name: sccache directory
        run: |
          "SCCACHE_DIR=${env:LOCALAPPDATA}\Mozilla\sccache" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Restore sccache
        id: restore-cache
        uses: actions/cache/restore@v5
        with:
          path: ${{ env.SCCACHE_DIR }}
          key: sccache-${{ runner.os }}-${{ runner.arch }}-${{ matrix.config }}-${{ github.sha }}
          restore-keys: sccache-${{ runner.os }}-${{ runner.arch }}-${{ matrix.config }}-

      - name: Prepare sccache
        run: |
          sccache -V && sccache --show-stats && sccache --zero-stats

      # No debug information (CMAKE_MSVC_DEBUG_INFORMATION_FORMAT empty): sccache cannot cache
      # /Zi, the Debug default, and /Z7 objects make a cache several times larger. Nothing in
      # these jobs reads the debug information.
      - name: Configure
        shell: cmd
        run: |
          call "${{ matrix.vs_path }}" -arch=x64
          cmake -G Ninja ^
            -DCMAKE_C_COMPILER_LAUNCHER=sccache ^
            -DCMAKE_CXX_COMPILER_LAUNCHER=sccache ^
            -DCMAKE_MSVC_DEBUG_INFORMATION_FORMAT= ^
            -DCMAKE_BUILD_TYPE=${{ matrix.config }} ^
            -DWMTK_BUILD_DOC_EXAMPLES=${{ matrix.config == 'Release' && 'ON' || 'OFF' }} ^
            ${{ matrix.integration_tests_flag }} ^
            -B build ^
            -S .

      # Until this check existed the Windows jobs compiled everything, every run, and nothing
      # said so: sccache logged no compilation at all and its cache directory was never created,
      # so the cache step had nothing to save. Fail here, before the build, when the compile
      # commands do not go through sccache.
      - name: Check the compiler launcher
        run: |
          $launcher = Select-String -Path build\build.ninja -Pattern '^\s+LAUNCHER = (.+)$' | Select-Object -First 1
          Write-Output "ccache on PATH: $((Get-Command ccache -ErrorAction SilentlyContinue).Source)"
          if (-not $launcher -or $launcher.Matches[0].Groups[1].Value -notmatch 'sccache') {
            Write-Output "::error::The compile commands do not go through sccache: $($launcher.Line)"
            exit 1
          }
          Write-Output "Compile launcher: $($launcher.Matches[0].Groups[1].Value.Trim())"

      - name: Build
        id: build
        shell: cmd
        run: |
          call "${{ matrix.vs_path }}" -arch=x64
          cmake --build build --parallel %NUMBER_OF_PROCESSORS% && sccache --show-stats

      # A build that compiled nothing through sccache fails, rather than passing with an empty
      # cache; one sccache could not cache much of warns.
      - name: Check sccache
        run: |
          $s = (sccache --show-stats --stats-format=json | ConvertFrom-Json).stats
          $requests = $s.compile_requests
          $uncacheable = $s.requests_not_cacheable
          Write-Output "sccache: $requests compile requests, $uncacheable not cacheable"
          if ($requests -eq 0) {
            Write-Output "::error::sccache saw no compilation: the build did not go through it"
            exit 1
          }
          if ($uncacheable -gt $requests / 10) {
            Write-Output "::warning::sccache could not cache $uncacheable of $requests compilations (see the stats above)"
          }

      # Stopped before the cache is saved, so it has written everything out.
      - name: Stop sccache
        if: always() && (steps.build.outcome == 'success' || steps.build.outcome == 'failure')
        run: sccache --stop-server

      - name: Save sccache
        if: >-
          always() && (steps.build.outcome == 'success' || steps.build.outcome == 'failure') &&
          steps.restore-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: ${{ env.SCCACHE_DIR }}
          key: ${{ steps.restore-cache.outputs.cache-primary-key }}

      - name: Tests
        run: |
          cd build
          ctest --verbose --output-on-failure
