name: Build

on:
  push:
    branches: [main]
  pull_request:
  # Manual runs, with an option to open an SSH session on the runner. A failure that
  # reproduces only in CI -- a different CPU, a different libstdc++, a restored ccache -- cannot
  # be chased from a laptop, and a bare signal with no stack trace is not enough to reason from.
  # See the "Debug over SSH" step below.
  workflow_dispatch:
    inputs:
      debug_ssh:
        description: "Open a tmate SSH session on the runner when a step fails"
        type: boolean
        default: false
      debug_ssh_always:
        description: "Open the session even when everything passes (to poke at a green runner)"
        type: boolean
        default: false

env:
  CTEST_OUTPUT_ON_FAILURE: ON
  CTEST_PARALLEL_LEVEL: 1

jobs:
  ####################
  # Linux
  ####################

  Linux:
    name: ${{ matrix.name }} (${{ matrix.config }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            config: Debug
            integration_tests_flag: &integration_tests_off ""
            name: Linux
          - os: ubuntu-latest
            config: Release
            integration_tests_flag: &integration_tests_on "-DWMTK_BUILD_INTEGRATION_TESTS=ON"
            name: Linux
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 10

      - name: Dependencies
        run: |
          sudo apt-get update
          sudo apt-get -o Acquire::Retries=3 install ccache
          echo 'CACHE_PATH=~/.cache/ccache' >> "$GITHUB_ENV"

      - name: Cache Build
        id: cache-build
        uses: actions/cache@v5
        with:
          path: ${{ env.CACHE_PATH }}
          key: ${{ runner.os }}-${{ matrix.config }}-cache-${{ github.sha }}
          restore-keys: ${{ runner.os }}-${{ matrix.config }}-cache

      - name: Prepare ccache
        run: |
          # ccache --max-size=20.0G
          ccache -V && ccache --show-stats && ccache --zero-stats

      - name: Configure
        run: |
          mkdir -p build
          cd build
          cmake .. \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DCMAKE_BUILD_TYPE=${{ matrix.config }} \
            ${{ matrix.integration_tests_flag }}

      - name: Build
        run: cd build; make -j2; ccache --show-stats

      - name: Tests
        run: cd build; ctest --verbose --output-on-failure

      # A crash in CI otherwise reports a bare signal and nothing else: Catch2 prints
      # "SIGILL - Illegal instruction signal" and the name of the test that was running, with no
      # frame to work from. That cost a day of guessing at a failure that reproduced on no
      # developer machine. gdb re-runs the one binary that died and prints where.
      #
      # Best-effort by design: `|| true` everywhere, and `if: failure()` so it costs a green run
      # nothing. It re-runs the WHOLE binary rather than the single case, because a crash that
      # only appears after earlier tests have run is exactly the kind this exists to catch.
      - name: Backtrace a crashed test
        if: failure()
        run: |
          sudo apt-get -o Acquire::Retries=3 install -y gdb || true
          cd build
          failed=$(ctest -N --show-only=human 2>/dev/null | awk '/Test *#/{print $3}')
          for t in $failed; do
            bin=$(find . -type f -perm -u+x -name "$t" 2>/dev/null | head -1)
            [ -x "$bin" ] || continue
            echo "::group::gdb $t"
            gdb -batch -ex run -ex "thread apply all bt" --args "$bin" 2>&1 | tail -80 || true
            echo "::endgroup::"
          done

      # Interactive access to the runner, manual runs only. Never triggers on a push or a PR:
      # workflow_dispatch is the only event that defines these inputs, and they default to false.
      - name: Debug over SSH (tmate)
        if: >-
          always() && github.event_name == 'workflow_dispatch' &&
          (inputs.debug_ssh_always || (failure() && inputs.debug_ssh))
        uses: mxschmitt/action-tmate@v3
        with:
          # Only the user who started the run can connect.
          limit-access-to-actor: true
        timeout-minutes: 30

  ####################
  # MacOS
  ####################

  MacOS:
    name: ${{ matrix.os }} (${{ matrix.config }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            config: Debug
            integration_tests_flag: *integration_tests_off
          - os: macos-latest
            config: Release
            integration_tests_flag: *integration_tests_on

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 10

      - name: Dependencies
        run: |
          brew install ccache
          echo 'CACHE_PATH=~/Library/Caches/ccache' >> "$GITHUB_ENV"

      - name: Cache Build
        id: cache-build
        uses: actions/cache@v5
        with:
          path: ${{ env.CACHE_PATH }}
          key: ${{ matrix.os }}-${{ matrix.config }}-cache-${{ github.sha }}
          restore-keys: ${{ matrix.os }}-${{ matrix.config }}-cache

      - name: Prepare ccache
        run: |
          # ccache --max-size=20.0G
          ccache -V && ccache --show-stats && ccache --zero-stats

      - name: Configure
        run: |
          mkdir -p build
          cd build
          cmake .. \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DCMAKE_BUILD_TYPE=${{ matrix.config }} \
            ${{ matrix.integration_tests_flag }}

      - name: Build
        run: cd build; make -j2; ccache --show-stats

      - name: Tests
        run: cd build; ctest --verbose --output-on-failure

      # A crash in CI otherwise reports a bare signal and nothing else: Catch2 prints
      # "SIGILL - Illegal instruction signal" and the name of the test that was running, with no
      # frame to work from. That cost a day of guessing at a failure that reproduced on no
      # developer machine. gdb re-runs the one binary that died and prints where.
      #
      # Best-effort by design: `|| true` everywhere, and `if: failure()` so it costs a green run
      # nothing. It re-runs the WHOLE binary rather than the single case, because a crash that
      # only appears after earlier tests have run is exactly the kind this exists to catch.
      - name: Backtrace a crashed test
        if: failure()
        run: |
          # lldb ships with the Xcode command line tools; nothing to install.
          cd build
          failed=$(ctest -N --show-only=human 2>/dev/null | awk '/Test *#/{print $3}')
          for t in $failed; do
            bin=$(find . -type f -perm -u+x -name "$t" 2>/dev/null | head -1)
            [ -x "$bin" ] || continue
            echo "::group::lldb $t"
            lldb -b -o run -o "thread backtrace all" -- "$bin" 2>&1 | tail -80 || true
            echo "::endgroup::"
          done

      # Interactive access to the runner, manual runs only. Never triggers on a push or a PR:
      # workflow_dispatch is the only event that defines these inputs, and they default to false.
      - name: Debug over SSH (tmate)
        if: >-
          always() && github.event_name == 'workflow_dispatch' &&
          (inputs.debug_ssh_always || (failure() && inputs.debug_ssh))
        uses: mxschmitt/action-tmate@v3
        with:
          # Only the user who started the run can connect.
          limit-access-to-actor: true
        timeout-minutes: 30

  ####################
  # Windows
  ####################

  Windows:
    name: ${{ matrix.name }} (${{ matrix.config }})
    runs-on: ${{ matrix.os }}
    env:
      SCCACHE_IDLE_TIMEOUT: "12000"
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025-vs2026
            name: Windows 2025 (VS 2026)
            config: Debug
            vs_path: &vs_path_2026 'C:\Program Files\Microsoft Visual Studio\18\Enterprise\Common7\Tools\VsDevCmd.bat'
            integration_tests_flag: *integration_tests_off
          - os: windows-2025-vs2026
            name: Windows 2025 (VS 2026)
            config: Release
            vs_path: *vs_path_2026
            integration_tests_flag: *integration_tests_on

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 10

      - name: Dependencies
        run: |
          choco install -y sccache
          "SCCACHE_DIR=${env:LOCALAPPDATA}\Mozilla\sccache" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Cache build
        id: cache-build
        uses: actions/cache@v5
        with:
          path: ${{ env.SCCACHE_DIR }}
          key: ${{ runner.os }}-${{ matrix.config }}-cache-${{ github.sha }}
          restore-keys: ${{ runner.os }}-${{ matrix.config }}-cache

      - name: Prepare sccache
        run: |
          sccache --max-size=1.0G
          sccache -V && sccache --show-stats && sccache --zero-stats

      - name: Configure
        shell: cmd
        run: |
          call "${{ matrix.vs_path }}" -arch=x64
          cmake -G Ninja ^
            -DCMAKE_CXX_COMPILER_LAUNCHER=sccache ^
            -DCMAKE_POLICY_DEFAULT_CMP0141=NEW ^
            -DCMAKE_MSVC_DEBUG_INFORMATION_FORMAT=Embedded ^
            -DCMAKE_BUILD_TYPE=${{ matrix.config }} ^
            ${{ matrix.integration_tests_flag }} ^
            -B build ^
            -S .

      - name: Build
        shell: cmd
        run: |
          call "${{ matrix.vs_path }}" -arch=x64
          cmake --build build -j2 && sccache --show-stats

      - name: Tests
        run: |
          cd build
          ctest --verbose --output-on-failure
