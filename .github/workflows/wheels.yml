name: wheels

# The wildmeshing Python package: wheels for macOS arm64, Linux x86_64 and arm64 and Windows
# x86_64, and the source distribution, built by cibuildwheel.
#
#   a version tag (v2.0.0)      publishes them on PyPI, and a GitHub Release with the files attached
#   a manual run                builds them, publishes nothing (the files are the run's artifacts)
#
# The version is the tag's: v2.0.0 builds 2.0.0 (a manual run's is setuptools-scm's, see
# pyproject.toml). Nothing is built on other pushes or on pull requests: every wheel compiles the
# whole toolkit.
#
# Publishing uses PyPI's trusted publishing, no token: the wildmeshing project on PyPI lists this
# repository, workflow wheels.yml, environment pypi, as a trusted publisher. The Python tests run in the Build workflow (continuous.yml), through ctest;
# cibuildwheel runs a quick smoke test on every wheel ([tool.cibuildwheel] in pyproject.toml).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: wheels-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # -------------------------------------------------------------------------
  # The version, and whether the ref is a release.
  # Computed once here and passed to every build (SETUPTOOLS_SCM_PRETEND_VERSION), so all the
  # files carry the same version and the Linux builds, in a manylinux container, need no git.
  # -------------------------------------------------------------------------
  version:
    name: version
    runs-on: ubuntu-latest
    outputs:
      kind: ${{ steps.version.outputs.kind }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          # Every tag and commit: a manual run's version is computed from them.
          fetch-depth: 0

      - id: version
        run: |
          ref="${GITHUB_REF_NAME}"
          if [[ "${GITHUB_REF_TYPE}" != tag ]]; then
            kind=none
            python -m pip install --quiet "setuptools-scm>=8"
            version=$(python -m setuptools_scm -c pyproject.toml | tail -n 1)
          elif [[ "$ref" =~ ^v[0-9]+(\.[0-9]+)*$ ]]; then
            kind=release
            version="${ref#v}"
          else
            echo "::error::$ref is not a version tag (v2.0.0, v2.1.0, ...)"
            exit 1
          fi
          echo "kind=$kind" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "wildmeshing $version ($kind)" >> "$GITHUB_STEP_SUMMARY"

  # -------------------------------------------------------------------------
  # The wheels, one job per platform
  # -------------------------------------------------------------------------
  build_wheels:
    name: wheel · ${{ matrix.label }}
    needs: version
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            label: macOS arm64
          - os: ubuntu-latest
            label: Linux x86_64
          - os: ubuntu-24.04-arm
            label: Linux arm64
          # The Build workflow's Windows image (continuous.yml), where the bindings are tested.
          - os: windows-2025-vs2026
            label: Windows x86_64

    env:
      SETUPTOOLS_SCM_PRETEND_VERSION: ${{ needs.version.outputs.version }}
      CIBW_ENVIRONMENT_PASS_LINUX: SETUPTOOLS_SCM_PRETEND_VERSION
      # Windows builds with the Visual Studio generator, which builds one project at a time
      # unless told otherwise (an hour for the first wheel); Ninja, on the others, is parallel.
      CMAKE_BUILD_PARALLEL_LEVEL: 4

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      # Builds the wheels and runs the smoke test from [tool.cibuildwheel] in pyproject.toml.
      # cibuildwheel repairs them (delocate on macOS, auditwheel on Linux; on Windows
      # python/src/CMakeLists.txt installs the GMP DLL into the wheel).
      - name: Build wheels
        uses: pypa/cibuildwheel@v4.3.5

      - name: Upload wheels
        uses: actions/upload-artifact@v7
        with:
          name: cibw-wheels-${{ matrix.os }}
          path: ./wheelhouse/*.whl

  # -------------------------------------------------------------------------
  # The source distribution
  # -------------------------------------------------------------------------
  make_sdist:
    name: sdist
    needs: version
    runs-on: ubuntu-latest
    env:
      SETUPTOOLS_SCM_PRETEND_VERSION: ${{ needs.version.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Build sdist
        run: |
          python -m pip install --upgrade build
          python -m build --sdist --outdir dist

      - name: Upload sdist
        uses: actions/upload-artifact@v7
        with:
          name: cibw-sdist
          path: ./dist/*.tar.gz

  # -------------------------------------------------------------------------
  # A version tag: PyPI, and a GitHub Release
  # -------------------------------------------------------------------------
  publish_pypi:
    name: publish to PyPI
    needs: [version, build_wheels, make_sdist]
    if: needs.version.outputs.kind == 'release'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/wildmeshing/
    permissions:
      id-token: write # PyPI trusted publishing (OIDC)
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: cibw-*
          path: dist
          merge-multiple: true

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  github_release:
    name: GitHub Release
    needs: [version, publish_pypi]
    if: needs.version.outputs.kind == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: cibw-*
          path: dist
          merge-multiple: true

      # Notes generated from the pull requests merged since the previous version tag. The first
      # release has none to start from, and would list every pull request ever merged.
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prev=$(gh api "repos/${GITHUB_REPOSITORY}/releases" --jq '[.[] | select(.draft | not) | .tag_name | select(test("^v[0-9]"))][0] // ""')
          if [[ -n "$prev" ]]; then
            notes=(--generate-notes --notes-start-tag "$prev")
          else
            notes=(--notes "The first release of the wildmeshing Python package from the toolkit: \`pip install wildmeshing\`. Documentation: https://wildmeshing.github.io/wildmeshing-toolkit/")
          fi
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --repo "${GITHUB_REPOSITORY}" \
            --title "${GITHUB_REF_NAME}" \
            "${notes[@]}"
