[build-system]
requires = ["scikit-build-core>=1.1", "pybind11>=2.11", "setuptools-scm>=8"]
build-backend = "scikit_build_core.build"

[project]
name = "wildmeshing"
# The version is the git tag's: v2.0.0 builds 2.0.0, and a commit after it 2.0.1.devN+g<hash>
# ([tool.setuptools_scm] below). Releases are made by pushing a tag (.github/workflows/wheels.yml).
dynamic = ["version"]
description = "Python bindings for WildMeshingToolkit"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["numpy>=1.23"]
license = { file = "LICENSE" }
authors = [{ name = "WildMeshingToolkit" }]
urls = { GitHub = "https://github.com/wildmeshing/wildmeshing-toolkit/" }

[project.optional-dependencies]
# The PolyFEM-backed operations, wildmeshing.polyfem_ops.
polyfem = ["gmsh", "scipy", "h5py"]

[tool.cibuildwheel]
# # Build CPython wheels.
build = ["cp*-*"]

# Skip 32-bit builds, Windows ARM, PyPy, musllinux (the Linux `before-all` below uses `yum`,
# which only exists on the manylinux images), and the free-threaded CPython builds (cp314t, ...),
# which a later release can add once the module is checked without the GIL.
skip = ["*-win32", "*-win_arm64", "*-*linux_i686", "pp*", "*-musllinux*", "cp3??t-*"]

# Smoke-test every built wheel on its target platform/Python: install it into an
# isolated environment and check dispatch and the NumPy memory interface. These
# need no external test data. The data-driven Python tests run in the Build workflow
# (.github/workflows/continuous.yml), through ctest.
test-requires = "pytest"
test-command = "pytest {project}/tests/python/test_smoke.py {project}/tests/python/test_memory_io.py {project}/tests/python/test_tracking.py"

[tool.cibuildwheel.linux]
before-all = "yum install -y gmp-devel"

[tool.cibuildwheel.linux.environment]
CXXFLAGS = "-D_GLIBCXX_USE_TBB_PAR_BACKEND=0"

[tool.cibuildwheel.macos]
# Install GMP from source since the Homebrew version causes issues.
before-all = """
    set -e
    GMP_VERSION=6.2.1
    curl -L https://ftp.gnu.org/gnu/gmp/gmp-${GMP_VERSION}.tar.xz -o gmp.tar.xz
    tar xf gmp.tar.xz
    cd gmp-${GMP_VERSION}
    # MPFR is sometimes needed by GMP, but we can disable it for a minimal build
    ./configure --prefix=$PWD/gmp-install --disable-assembly --enable-cxx --with-pic --disable-mpfr
    make -j4
    make install
    cd ..
"""

[tool.cibuildwheel.macos.environment]
GMP_DIR = "gmp-6.2.1/gmp-install"


[tool.scikit-build]
cmake.version = ">=3.25"

# --- Build Configuration ---
# Release (optimized, no debug symbols) is the default for the published bindings.
# To switch to RelWithDebInfo or Debug, comment out the Release lines and
# uncomment the desired pair below.
cmake.build-type = "Release"
build-dir = "build/Release"

# cmake.build-type = "RelWithDebInfo"
# build-dir = "build/RelWithDebInfo"

# cmake.build-type = "Debug"
# build-dir = "build/Debug"

cmake.args = [
  "-DWMTK_PYBIND=ON",
  "-DCMAKE_INSTALL_DEFAULT_COMPONENT_NAME=python_bindings",
  "-DBUILD_TESTING=OFF",
]
install.components = ["python_bindings"]
# The pure-Python part of the package; the compiled module is installed into it as _core.
wheel.packages = ["python/wildmeshing"]

# Build the module the wheel installs (and what it links), not the default `all`: that also builds
# wmtk_app and topological_offset's developer-only wmtk_offset_field module, neither of which is
# installed, and wmtk_offset_field does not link with GCC 15 (Ubuntu 26.04), which failed the
# whole `pip install`.
build.targets = ["wildmeshing"]

# The version from git (see [project]). Only v<version> tags are versions: the repository's other
# tags (1.0, the paper's; backup/...) are not.
[tool.setuptools_scm]
tag_regex = "^v(?P<version>[0-9]+(?:\\.[0-9]+)*)$"
git_describe_command = ["git", "describe", "--dirty", "--tags", "--long", "--match", "v[0-9]*"]

[[tool.dynamic-metadata]]
provider = "scikit_build_core.metadata.setuptools_scm"
